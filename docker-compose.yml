version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: fullstack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fullstack_db
      MYSQL_USER: fullstack_user
      MYSQL_PASSWORD: fullstack_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    networks:
      - fullstack-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Category Service (Golang)
  category-service:
    build:
      context: ./golang
      dockerfile: Dockerfile
    container_name: category-service
    restart: unless-stopped
    environment:
      PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - fullstack-network

  # Node.js Application (Express)
  nodejs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodejs-app
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_USER: fullstack_user
      DB_PASSWORD: fullstack_password
      DB_NAME: fullstack_db
      DB_PORT: 3306
      CATEGORY_SERVICE_URL: http://category-service:8080
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      category-service:
        condition: service_started
    networks:
      - fullstack-network
    volumes:
      - ./public:/app/public

volumes:
  mysql_data:
    driver: local

networks:
  fullstack-network:
    driver: bridge
